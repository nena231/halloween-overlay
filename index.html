<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Golden Fantasy Halloween Stream Overlay</title>

  <!-- Google Fonts: Creepster for Title, Irish Grover for Prize -->
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Irish+Grover&display=swap" rel="stylesheet">

  <!-- Include Three.js and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    /* CSS Variables for the Sun/Moon Color (Default Orange) */
    :root {
      --moon-rgb: 230, 126, 34; 
      --moon-color-mid: #f1c40f;
      --moon-color-dark: #e67e22;
      --moon-transition: 0.4s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      user-select: none;
    }

    #scene-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #5c2810 0%, #2c0e06 55%, #100402 100%);
      overflow: hidden;
    }

    .moon {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffdf0 0%, var(--moon-color-mid) 45%, var(--moon-color-dark) 100%);
      box-shadow: 
        0 0 50px rgba(var(--moon-rgb), 0.9),
        0 0 120px rgba(var(--moon-rgb), 0.6),
        0 0 200px rgba(var(--moon-rgb), 0.4);
      animation: moonGlow 6s infinite ease-in-out alternate;
      transition: background var(--moon-transition), box-shadow var(--moon-transition);
    }

    @keyframes moonGlow {
      0% { box-shadow: 0 0 50px rgba(var(--moon-rgb), 0.9), 0 0 110px rgba(var(--moon-rgb), 0.6), 0 0 180px rgba(var(--moon-rgb), 0.4); }
      100% { box-shadow: 0 0 70px rgba(var(--moon-rgb), 1), 0 0 140px rgba(var(--moon-rgb), 0.8), 0 0 240px rgba(var(--moon-rgb), 0.6); }
    }

    #effects-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2; pointer-events: none;
    }

    #three-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5; pointer-events: none;
    }

    .silhouette-svg {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: auto;
      max-height: 55%;
      z-index: 4; pointer-events: none;
    }

    .fog-layer {
      position: absolute;
      bottom: -10%; left: -20%;
      width: 140%; height: 45%;
      background: radial-gradient(ellipse at 50% 100%, rgba(245, 158, 11, 0.22) 0%, rgba(217, 119, 6, 0.12) 40%, rgba(0, 0, 0, 0) 80%);
      filter: blur(40px);
      z-index: 1;
      animation: fogDrift 16s infinite ease-in-out alternate;
    }

    @keyframes fogDrift {
      0% { transform: translateX(-5%) translateY(0); opacity: 0.7; }
      100% { transform: translateX(5%) translateY(-15px); opacity: 1; }
    }

    /* Control Panel */
    #control-panel {
      position: absolute;
      top: 20px; left: 20px;
      z-index: 100;
      background: rgba(20, 6, 3, 0.9);
      border: 2px solid #f1c40f;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
      color: #fffdf0;
      width: 260px;
    }

    #control-panel h3 {
      font-size: 15px;
      margin-bottom: 10px;
      color: #f1c40f;
      border-bottom: 1px solid rgba(241, 196, 15, 0.3);
      padding-bottom: 5px;
    }

    .control-group { margin-bottom: 10px; }
    .control-group label { display: block; font-size: 11px; margin-bottom: 4px; color: #ffd700; text-transform: uppercase; }

    .control-group select, .control-group button {
      width: 100%; padding: 10px; background: #2c0e06; border: 1px solid #f1c40f; border-radius: 5px; color: #fffdf0; font-weight: bold; cursor: pointer; margin-bottom: 5px;
    }

    .control-group button {
      background: linear-gradient(to bottom, #f1c40f, #d35400);
      border: none;
      margin-top: 5px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
    }
    .control-group button:hover { background: linear-gradient(to bottom, #ffeaa7, #e67e22); color: #1a0805; }
    .control-group button:disabled { filter: grayscale(100%); cursor: not-allowed; }

    #reset-button { background: linear-gradient(to bottom, #e74c3c, #c0392b); }
    #reset-button:hover { background: linear-gradient(to bottom, #ff7675, #e74c3c); color: #fff;}
    #reset-button:disabled { background: #555; color: #888; box-shadow: none; }

    .streamer-tools { border-top: 1px dashed rgba(241, 196, 15, 0.4); padding-top: 10px; margin-top: 10px; }

    /* Hides panel in OBS */
    .obs-mode #control-panel { display: none; }

    /* =========================================
       REVEAL OVERLAY STYLES
       ========================================= */
    
    #screen-flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #fff; opacity: 0; z-index: 50; pointer-events: none;
    }
    .flash-anim { animation: flashAnim 0.4s ease-out; }
    @keyframes flashAnim { 0% { opacity: 0.8; } 100% { opacity: 0; } }

    #result-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
      z-index: 60; pointer-events: none; text-align: center; opacity: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.3s, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #result-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    #aura {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 700px; height: 400px; border-radius: 50%;
      filter: blur(50px); opacity: 0.7; z-index: -1;
      transition: background 0.4s;
    }

    #result-text {
      font-family: 'Creepster', cursive;
      font-size: 90px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #fff;
      -webkit-text-stroke: 3px black;
      text-shadow: 0 5px 15px rgba(0,0,0,0.9), 0 0 20px #fff, 0 0 40px #fff, 0 0 80px #ff00de;
      animation: float 3s ease-in-out infinite;
    }

    #result-subtext {
      font-family: 'Irish Grover', cursive;
      font-weight: normal; 
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 30px; 
      color: #fff; 
      -webkit-text-stroke: 2px black;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9);
      max-width: 90vw;
      word-wrap: break-word;
      line-height: 1.2;
    }

    .prize-treat { font-size: 49px; }
    .prize-trick { font-size: 35px; }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>

  <div id="scene-container">
    <div id="screen-flash"></div>
    <div id="result-overlay">
      <div id="aura"></div>
      <div id="result-text">TREAT</div>
      <div id="result-subtext" class="prize-treat">$15</div>
    </div>

    <div id="control-panel">
      <h3>Giveaway Controls</h3>
      
      <div class="control-group">
        <button id="roll-button" onclick="triggerRoll()">ROLL CHEST</button>
        <button id="reset-button" onclick="resetChest()" disabled>RESET CHEST</button>
      </div>

      <div class="control-group streamer-tools">
        <label>Streamer Override (Testing/Custom)</label>
        <select id="force-roll-type">
          <option value="random">Normal (50% Trick / 50% Treat)</option>
          <option value="only-treats">Only Treats (Random Tier)</option>
          <option value="common">Force Common Treat</option>
          <option value="uncommon">Force Uncommon Treat</option>
          <option value="rare">Force Rare Treat</option>
          <option value="legendary">Force Legendary Treat</option>
          <option value="standard-trick">Force Standard Trick (Random)</option>
          <option value="legendary-trick">Force Legendary Trick (Ban)</option>
        </select>
      </div>
    </div>

    <div class="moon"></div>
    <div class="fog-layer"></div>
    <canvas id="effects-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <svg class="silhouette-svg" viewBox="0 0 1920 600" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0,600 L0,500 Q250,470 500,520 T1000,480 Q1400,530 1920,490 L1920,600 Z" fill="#140603"/>
      <path d="M0,600 L0,520 Q350,500 700,540 T1400,510 Q1700,550 1920,530 L1920,600 Z" fill="#0a0301"/>
      <g fill="#0a0301">
        <path d="M-20,600 Q60,350 30,150 Q10,80 -40,0 L-60,0 L-60,600 Z"/>
        <path d="M25,280 Q120,220 180,240 Q150,250 20,310 Z"/>
        <path d="M15,200 Q100,120 220,110 Q180,130 10,230 Z"/>
      </g>
      <g fill="#0a0301">
        <path d="M1940,600 Q1860,350 1890,120 Q1920,50 1980,0 L2000,0 L2000,600 Z"/>
        <path d="M1895,290 Q1800,230 1730,250 Q1770,260 1900,320 Z"/>
        <path d="M1905,190 Q1810,110 1690,100 Q1740,125 1900,210 Z"/>
      </g>
    </svg>
  </div>

  <script>
    // Checks if you are in OBS mode
    const isObsMode = window.location.search.includes('obs=true');
    if (isObsMode) {
      document.body.classList.add('obs-mode');
    }

    // =========================================
    // 🎮 KEYBOARD CONTROLS (R TO ROLL, C TO RESET)
    // =========================================
    document.addEventListener('keydown', function(event) {
      if (isObsMode) {
        // Press 'R' to Roll
        if (event.key.toLowerCase() === 'r') {
          triggerRoll();
        }
        // Press 'C' to Reset/Close
        if (event.key.toLowerCase() === 'c') {
          resetChest();
        }
      }
    });

    /* =========================================
       1. RNG & ODDS LOGIC
       ========================================= */
    const TREATS = {
      common: [ "$3", "$5", "$5 BJ hand", "10 or 5 keno bets" ],
      uncommon: [ "$7", "$10" ],
      rare: [ "$15", "$20" ],
      legendary: [ "$40 buy split", "$20 buy keep all ($100 max)" ]
    };

    const TRICKS = {
      standard: [ 
        "You're a cuck", "Double roll to next winner", "Timed out 10 minutes", "Scammed",
        "Psych! It's a $5 treat.", "The streamer steals 50% of your next win.", "Dance on stream for 30 seconds or lose.",
        "NO GIVEAWAY", "MOOD OFF", "YOU WON 1 BETCLOSER NET WORTH", "YOU SLEEPING NEXT TO BADRUDEBOI TODAY"
      ],
      legendary: [ "Banned from giveaways for next month" ]
    };

    const ODDS = {
      trickPercent: 50, 
      treatPercent: 50,
      treatWeights: { common: 40, uncommon: 35, rare: 20, legendary: 5 },
      trickWeights: { standard: 99, legendary: 1 }
    };

    const COLORS = {
      common: '#cccccc', uncommon: '#2ecc71', rare: '#3498db',
      legendary: '#f1c40f', trick: '#e74c3c', legendaryTrick: '#8e44ad'
    };

    const DEFAULT_ORANGE = '#e67e22'; 
    const DEFAULT_ORANGE_RGB = '230, 126, 34';

    let eyeGlowColor = DEFAULT_ORANGE; 
    let forceEyeColor = false; 
    let currentFogR = 245, currentFogG = 158, currentFogB = 11;

    function getWeightedRandom(weightsObject, itemsObject) {
      let totalWeight = 0;
      for (let key in weightsObject) totalWeight += weightsObject[key];
      let random = Math.random() * totalWeight;
      let cumulativeWeight = 0;
      for (let key in weightsObject) {
        cumulativeWeight += weightsObject[key];
        if (random <= cumulativeWeight) {
          const items = itemsObject[key];
          return { category: key, item: items[Math.floor(Math.random() * items.length)] };
        }
      }
    }

    function hexToRgb(hex) {
      let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 230, g: 126, b: 34 };
    }

    function setEnvironmentColor(hexColor, rgbString) {
      document.documentElement.style.setProperty('--moon-rgb', rgbString);
      document.documentElement.style.setProperty('--moon-color-mid', hexColor);
      
      const rgbObj = hexToRgb(hexColor);
      const darkerHex = `rgb(${Math.max(0, rgbObj.r - 40)}, ${Math.max(0, rgbObj.g - 40)}, ${Math.max(0, rgbObj.b - 40)})`;
      document.documentElement.style.setProperty('--moon-color-dark', darkerHex);

      currentFogR = rgbObj.r; currentFogG = rgbObj.g; currentFogB = rgbObj.b;
      eyeGlowColor = hexColor;
    }

    /* =========================================
       2. THREE.JS SETUP
       ========================================= */
    const threeCanvas = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 4.5);

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.AmbientLight(0xfff5e6, 1.2));
    const keyLight = new THREE.DirectionalLight(0xffd700, 2.0); keyLight.position.set(5, 5, 4); scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xff6600, 1.0); fillLight.position.set(-5, 2, 3); scene.add(fillLight);

    const chestLight = new THREE.PointLight(0xffffff, 0, 8, 2);
    chestLight.position.set(0, 0.5, 0); scene.add(chestLight);

    const chestContainer = new THREE.Group(); scene.add(chestContainer);

    let chestModel = null, mixer = null, animationsMap = {}, activeAction = null;
    let isRolling = false, revealTimer = null;
    const clock = new THREE.Clock();
    const initialChestPos = new THREE.Vector3(), initialChestScale = new THREE.Vector3(1, 1, 1);

    const loader = new THREE.GLTFLoader();
    loader.load('chest.glb', function (gltf) {
      chestModel = gltf.scene; chestContainer.add(chestModel);

      const box = new THREE.Box3().setFromObject(chestModel); 
      const center = box.getCenter(new THREE.Vector3()); 
      const size = box.getSize(new THREE.Vector3());
      
      chestModel.position.sub(center); chestModel.position.y -= 0.16; 
      initialChestPos.copy(chestModel.position);

      const maxDim = Math.max(size.x, size.y, size.z);
      chestContainer.scale.setScalar(1.2 / maxDim);
      
      chestContainer.position.y = -.19
      chestContainer.rotation.x = -0.27
      chestContainer.rotation.y = Math.PI + 0.2 

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(chestModel);
        gltf.animations.forEach((clip) => {
          clip.tracks = clip.tracks.filter(track => {
            if (track.name.includes('.scale')) return false; 
            if (track.name.endsWith('.position') && !track.name.includes('/')) return false;
            return true;
          });
          animationsMap[clip.name] = mixer.clipAction(clip);
        });
        mixer.addEventListener('finished', onAnimationFinished);
        if (animationsMap['Armature|close_idle']) {
          activeAction = animationsMap['Armature|close_idle'];
          activeAction.play();
        }
      }
    });

    function playSelectedAnimation(name, loopOnce = false) {
      if (!mixer || !animationsMap[name]) return;
      const nextAction = animationsMap[name];
      if (activeAction === nextAction) return;

      if (activeAction) activeAction.fadeOut(0.3);
      nextAction.reset().setEffectiveTimeScale(1).setEffectiveWeight(1);
      
      if (loopOnce) { nextAction.setLoop(THREE.LoopOnce, 1); nextAction.clampWhenFinished = true; } 
      else { nextAction.setLoop(THREE.LoopRepeat, Infinity); }
      
      nextAction.fadeIn(0.3).play();
      activeAction = nextAction;
    }

    /* =========================================
       3. SEQUENCE LOGIC
       ========================================= */
    function triggerRoll() {
      if (isRolling || !mixer) return;
      isRolling = true;
      
      const rollBtn = document.getElementById('roll-button');
      const resetBtn = document.getElementById('reset-button');
      if (rollBtn) rollBtn.disabled = true;
      if (resetBtn) resetBtn.disabled = true;
      
      document.getElementById('result-overlay').classList.remove('show');
      
      const openAction = animationsMap['Armature|open'];
      playSelectedAnimation('Armature|open', true);

      if (openAction) {
        const duration = openAction.getClip().duration;
        const revealDelay = duration * 0.45 * 1000; 
        if (revealTimer) clearTimeout(revealTimer);
        revealTimer = setTimeout(() => { showResult(); }, revealDelay);
      } else { showResult(); }
    }

    function resetChest() {
      if (!mixer) return;
      
      const resetBtn = document.getElementById('reset-button');
      if (resetBtn) resetBtn.disabled = true;
      
      const overlay = document.getElementById('result-overlay');
      overlay.classList.remove('show');
      
      chestLight.intensity = 0;
      setEnvironmentColor(DEFAULT_ORANGE, DEFAULT_ORANGE_RGB);
      forceEyeColor = false; 

      setTimeout(() => { playSelectedAnimation('Armature|close', true); }, 300); 
    }

    function onAnimationFinished(e) {
      if (e.action === animationsMap['Armature|close']) {
        playSelectedAnimation('Armature|close_idle');
        isRolling = false;
        const rollBtn = document.getElementById('roll-button');
        if (rollBtn) rollBtn.disabled = false;
      }
    }

    function showResult() {
      if (!isRolling) return;

      let isTrick, result, color;
      const forceDropdown = document.getElementById('force-roll-type');
      const forceType = forceDropdown ? forceDropdown.value : 'random';

      if (forceType === 'common') {
        isTrick = false; result = { category: 'common', item: TREATS.common[Math.floor(Math.random() * TREATS.common.length)] }; color = COLORS.common;
      } else if (forceType === 'uncommon') {
        isTrick = false; result = { category: 'uncommon', item: TREATS.uncommon[Math.floor(Math.random() * TREATS.uncommon.length)] }; color = COLORS.uncommon;
      } else if (forceType === 'rare') {
        isTrick = false; result = { category: 'rare', item: TREATS.rare[Math.floor(Math.random() * TREATS.rare.length)] }; color = COLORS.rare;
      } else if (forceType === 'legendary') {
        isTrick = false; result = { category: 'legendary', item: TREATS.legendary[Math.floor(Math.random() * TREATS.legendary.length)] }; color = COLORS.legendary;
      } else if (forceType === 'standard-trick') {
        isTrick = true; result = { category: 'standard', item: TRICKS.standard[Math.floor(Math.random() * TRICKS.standard.length)] }; color = COLORS.trick;
      } else if (forceType === 'legendary-trick') {
        isTrick = true; result = { category: 'legendary', item: TRICKS.legendary[0] }; color = COLORS.legendaryTrick;
      } else if (forceType === 'only-treats') {
        isTrick = false; result = getWeightedRandom(ODDS.treatWeights, TREATS); color = COLORS[result.category];
      } else {
        isTrick = Math.random() * 100 < ODDS.trickPercent;
        if (isTrick) {
          result = getWeightedRandom(ODDS.trickWeights, TRICKS);
          color = result.category === 'legendary' ? COLORS.legendaryTrick : COLORS.trick;
        } else {
          result = getWeightedRandom(ODDS.treatWeights, TREATS);
          color = COLORS[result.category];
        }
      }

      const rgbObj = hexToRgb(color);
      const rgbString = `${rgbObj.r}, ${rgbObj.g}, ${rgbObj.b}`;

      setEnvironmentColor(color, rgbString);
      forceEyeColor = true;
      
      creepyEyes.forEach(e => { e.isBlinking = true; e.blinkEnd = Date.now() + 150; });

      chestLight.color.setStyle(color);
      chestLight.intensity = 8;

      const flash = document.getElementById('screen-flash');
      flash.style.backgroundColor = color;
      flash.classList.remove('flash-anim');
      void flash.offsetWidth; 
      flash.classList.add('flash-anim');

      const overlay = document.getElementById('result-overlay');
      const aura = document.getElementById('aura');
      const mainText = document.getElementById('result-text');
      const subText = document.getElementById('result-subtext');

      mainText.innerText = isTrick ? "TRICK" : "TREAT";
      mainText.style.textShadow = `0 5px 15px rgba(0,0,0,0.9), 0 0 20px ${color}, 0 0 40px ${color}, 0 0 80px ${color}`;
      
      subText.innerText = result.item;
      subText.className = isTrick ? 'prize-trick' : 'prize-treat';
      
      aura.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;

      overlay.classList.add('show');
      const resetBtn = document.getElementById('reset-button');
      if (resetBtn) resetBtn.disabled = false;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* =========================================
       4. 2D EFFECTS CANVAS (Background, Bats, & Eyes)
       ========================================= */
    const canvas = document.getElementById('effects-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let embers = [], fogParticles = [], bats = [], creepyEyes = [];

    function resizeEffectsCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeEffectsCanvas);
    resizeEffectsCanvas();

    for (let i = 0; i < 85; i++) {
      embers.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 3 + 1, speedY: -(Math.random() * 1.3 + 0.4), speedX: (Math.random() - 0.5) * 0.7, opacity: Math.random() * 0.85 + 0.15, hue: Math.random() > 0.3 ? 42 : 28, pulseSpeed: Math.random() * 0.03 + 0.01 });
    }
    for (let i = 0; i < 20; i++) {
      fogParticles.push({ x: Math.random() * width, y: height - (Math.random() * 250), radius: Math.random() * 130 + 80, speedX: Math.random() * 0.4 + 0.1, opacity: Math.random() * 0.15 + 0.04 });
    }
    for (let i = 0; i < 6; i++) {
      bats.push({ x: Math.random() * width, y: Math.random() * (height * 0.45), speedX: Math.random() * 2.5 + 1.2, speedY: Math.sin(Math.random() * Math.PI) * 0.8, size: Math.random() * 12 + 10, wingAngle: 0, wingSpeed: Math.random() * 0.15 + 0.1 });
    }

    let eyeAttempts = 0;
    while (creepyEyes.length < 15 && eyeAttempts < 1000) {
      eyeAttempts++;
      const newX = (width / 2) + ((Math.random() - 0.5) * (width * 0.6));
      const newY = height * 0.15 + Math.random() * (height * 0.35);
      let tooClose = false;
      for (let e of creepyEyes) { if (Math.hypot(e.x - newX, e.y - newY) < 80) { tooClose = true; break; } }
      if (!tooClose) {
        creepyEyes.push({ x: newX, y: newY, size: Math.random() * 3 + 2, offset: Math.random() * 8 + 10, baseColor: DEFAULT_ORANGE, nextBlink: Date.now() + Math.random() * 5000, isBlinking: false, blinkEnd: 0 });
      }
    }

    function drawBat(b) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.fillStyle = '#0a0301';
      const s = b.size; const wing = Math.sin(b.wingAngle) * (s * 0.6);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-s * 0.5, -s * 0.5 - wing, -s, -wing); ctx.quadraticCurveTo(-s * 0.5, 0, 0, s * 0.3); ctx.quadraticCurveTo(s * 0.5, 0, s, -wing); ctx.quadraticCurveTo(s * 0.5, -s * 0.5 - wing, 0, 0); ctx.fill(); ctx.restore();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      
      if (mixer) {
        mixer.update(delta);
        if (chestModel) {
          chestModel.position.copy(initialChestPos);
          chestModel.scale.copy(initialChestScale);
        }
      }

      renderer.render(scene, camera);
      ctx.clearRect(0, 0, width, height);

      fogParticles.forEach(f => {
        f.x += f.speedX;
        if (f.x - f.radius > width) { f.x = -f.radius; f.y = height - (Math.random() * 250); }
        const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
        grad.addColorStop(0, `rgba(${currentFogR}, ${currentFogG}, ${currentFogB}, ${f.opacity})`); 
        grad.addColorStop(0.6, `rgba(${Math.max(0, currentFogR - 40)}, ${Math.max(0, currentFogG - 40)}, ${Math.max(0, currentFogB - 40)}, ${f.opacity * 0.4})`); 
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
      });

      embers.forEach(p => {
        p.y += p.speedY; p.x += p.speedX + Math.sin(p.y * 0.01) * 0.3; p.opacity += Math.sin(Date.now() * p.pulseSpeed) * 0.01;
        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
        ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${Math.max(0.1, Math.min(1, p.opacity))})`;
        ctx.shadowBlur = 14; ctx.shadowColor = p.hue === 42 ? '#f1c40f' : '#e67e22'; ctx.fill(); ctx.restore();
      });

      creepyEyes.forEach(e => {
        if (Date.now() > e.nextBlink) { if (!e.isBlinking) { e.isBlinking = true; e.blinkEnd = Date.now() + 200; } }
        if (e.isBlinking && Date.now() > e.blinkEnd) { e.isBlinking = false; e.nextBlink = Date.now() + Math.random() * 6000 + 2000; }

        if (!e.isBlinking) {
          const activeColor = forceEyeColor ? eyeGlowColor : e.baseColor;
          ctx.fillStyle = activeColor; ctx.shadowBlur = 15; ctx.shadowColor = activeColor;
          const sway = Math.sin(Date.now() * 0.001 + e.x) * 2;
          ctx.beginPath(); ctx.arc(e.x + sway, e.y, e.size, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(e.x + e.offset + sway, e.y, e.size, 0, Math.PI * 2); ctx.fill();
        }
      });

      bats.forEach(b => {
        b.x += b.speedX; b.y += Math.sin(b.x * 0.01) * 0.8; b.wingAngle += b.wingSpeed;
        if (b.x - b.size * 2 > width) { b.x = -b.size * 2; b.y = Math.random() * (height * 0.45); }
        drawBat(b);
      });
    }

    animate();
  </script>
</body>
</html>
